name: Refresh userscript CDN
on:
  push:
    branches: [main]
    paths:
      - aether-auto-helper.user.js
      - scripts/refresh-cdn.cjs
      - .github/workflows/purge-jsdelivr.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refresh-userscript-cdn
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/refresh-cdn.cjs
